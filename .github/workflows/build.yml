name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Build the app projects only. SyteQuery.IDO compiles against Infor's SyteLine assemblies,
      # which can't be redistributed and so aren't available on the runner (see SyteQuery.IDO/README.md).
      - name: Restore
        run: dotnet restore SyteQuery.Desktop/SyteQuery.Desktop.csproj

      - name: Build
        run: dotnet build SyteQuery.Desktop/SyteQuery.Desktop.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test SyteQuery.Tests/SyteQuery.Tests.csproj --configuration Release

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list SyteQuery.Desktop/SyteQuery.Desktop.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable packages found.' }
